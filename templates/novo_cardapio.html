{% extends "base.html" %}

{% block conteudo %}

<h2>Cadastrar Cardápio</h2>

<form method="post">
  <label>Dia da semana:</label>
  <input type="text" name="dia_semana" required>

  <label>Refeição:</label>
  <input type="text" name="refeicao" required>

  <button type="submit">Salvar</button>
</form>
{% if current_user.is_authenticated and current_user.tipo == "nutricionista" %}
  <a href="{{ url_for('novo_cardapio') }}">Editar Cardápio</a>
{% endif %}
{% endblock %}
