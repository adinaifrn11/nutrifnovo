<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="POST">
    <h1>Editar Meu Perfil</h1>
    
    <label>Nome:</label>
    <input type="text" name="nome" value="{{ current_user.nome }}" required>

    <label>Email:</label>
    <input type="email" name="email" value="{{ current_user.email }}" required>

    <label>Novo email (deixe em branco para não mudar):</label>
    <input type="password" name="email">

    <button type="submit">Salvar Alterações</button>
    <a href="{{ url_for('perfilusuario') }}">Cancelar</a>
</form>
</body>
</html>
