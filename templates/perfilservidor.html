<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Perfil do Servidor - NUTRIF</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   <link rel="stylesheet" href="{{ url_for('static', filename='css/perfilservidor.css') }}">
</head>

<body>

   <header class="topo">
      <div class="logo">
         <img src="{{ url_for('static', filename='imgs/logo.jpg') }}" alt="Logo Nutrif">
      </div>

      <nav class="menu">
         <a href="{{ url_for('index') }}">HOME</a>
         <a href="{{ url_for('feedback_form') }}">FEEDBACK</a>
         <a href="{{ url_for('cardapio') }}">CARDÁPIO</a>
         <a href="{{ url_for('receitas') }}">RECEITAS</a>
         <a href="{{ url_for('contato') }}">CONTATOS</a>
      </nav>

      <div class="perfil">
         <img src="{{ url_for('static', filename='imgs/PESSOA.png') }}" alt="Perfil">
         <a href="{{ url_for('perfilservidor') }}">PERFIL SERVIDOR</a>
      </div>
   </header>

   <main class="container">

      <h1 class="titulo">PERFIL DO SERVIDOR</h1>

      <!-- CARD PERFIL -->
      <section class="card perfil">
         <img class="avatar" src="{{ url_for('static', filename='imgs/PESSOA.png') }}" alt="Servidor">

         <div class="info">
            <p class="nome">Ana paula</p>
            <p>matrícula: 000000</p>
         </div>
      </section>

      <!-- CARD CONTATO -->
      <section class="card">
         <div class="card-header">
            <h2>EDITAR CONTATO</h2>
         </div>
         <div class="contato-info">
            <p><strong>Nome:</strong> Ana paula</p>
            <p><strong>Email:</strong> anapaula@gmail.com</p>
            <p><strong>Telefone:</strong> (84) 98866-8788</p>
         </div>
      </section>

      <!-- AÇÕES DO SERVIDOR -->
      <section class="card">
         <div class="card-header">
            <h2>AÇÕES</h2>
         </div>
         <div class="acoes-servidor">
            <a href="#" class="btn verde">Registrar Cardápio</a>
            <a href="#" class="btn verde">Verificar Restrições</a>
         </div>
      </section>

      <!-- BOTÕES DE AÇÃO -->
      <div class="acoes">
         <button class="btn verde" onclick="history.back()">VOLTAR</button>
         <a href="{{ url_for('logoff') }}" class="btn amarelo">SAIR</a>
      </div>

      <form action="{{ url_for('excluir_conta') }}" method="post">
         <button class="btn vermelho">EXCLUIR CONTA</button>
      </form>

   </main>

   <footer class="rodape">
      <div class="footer-links">
         <a href="{{ url_for('index') }}">Início</a>
         <a href="#">Sobre nós</a>
         <a href="#">Ajuda</a>
      </div>
      <p>© 2025 Nutrif.</p>
   </footer>

</body>
</html>
